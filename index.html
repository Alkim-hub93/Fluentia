<style>
:root{
  --f-display:'Gabarito','Trebuchet MS',ui-rounded,system-ui,sans-serif;
  --f-body:'Lexend','Segoe UI',system-ui,-apple-system,sans-serif;
  --paper:#f1f3fb; --grid:rgba(24,36,120,.055);
  --card:#ffffff; --card2:#f5f6fc;
  --ink:#0e1533; --ink2:#394063; --muted:#69708f;
  --line:#dce1f2; --edge:#0e1533;
  --cobalt:#3347ff; --cobalt-ink:#ffffff; --cobalt-soft:#e3e6ff;
  --mark:#ffe14d; --mark-ink:#0e1533;
  --mint:#10b981; --mint-soft:#d6f6e8; --mint-ink:#065f46;
  --rose:#ff4466; --rose-soft:#ffe0e6; --rose-ink:#9f1239;
  --amber:#ff9d1a; --amber-soft:#ffecc9;
}
.dark{
  --paper:#0e1b19; --grid:rgba(230,245,236,.045);
  --card:#142523; --card2:#1a2f2c;
  --ink:#ecf4ee; --ink2:#c2d1c8; --muted:#8aa196;
  --line:#264340; --edge:#030908;
  --cobalt:#8f9cff; --cobalt-ink:#0e1b19; --cobalt-soft:#26305f;
  --mark:#ffe14d; --mark-ink:#0e1b19;
  --mint:#3ddca4; --mint-soft:#133a30; --mint-ink:#7bf0c7;
  --rose:#ff7a92; --rose-soft:#3d1f2a; --rose-ink:#ffb3c1;
  --amber:#ffb84d; --amber-soft:#3b2d12;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper);-webkit-text-size-adjust:100%}
button,a,.btn,.opt,.chip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#hdr{padding-top:calc(.75rem + env(safe-area-inset-top,0px))}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.01em;line-height:1.1;margin:0;color:var(--ink)}
button{font-family:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px}
.sticker{background:var(--card);border:2px solid var(--edge);border-radius:22px;box-shadow:5px 5px 0 var(--edge)}
.hero{background:var(--card);border:2px solid var(--edge);border-radius:28px;box-shadow:6px 6px 0 var(--edge)}
.dark .sticker,.dark .hero{border-color:var(--line);box-shadow:5px 5px 0 #000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.15rem;font-weight:500;font-size:.92rem;line-height:1.1;border:2px solid var(--edge);border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--edge);cursor:pointer;transition:transform .08s ease,box-shadow .08s ease,background .15s;user-select:none;text-align:center}
.btn:hover{background:var(--card2)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--cobalt);color:var(--cobalt-ink)} .btn-primary:hover{background:var(--cobalt);filter:brightness(1.08)}
.btn-mark{background:var(--mark);color:var(--mark-ink)} .btn-mark:hover{background:var(--mark);filter:brightness(1.05)}
.btn-rose{background:var(--rose);color:#fff} .btn-rose:hover{background:var(--rose)}
.btn-ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--ink2)} .btn-ghost:active{transform:none}
.btn-sm{padding:.5rem .8rem;font-size:.82rem;border-radius:12px;box-shadow:0 3px 0 var(--edge)}
.btn-icon{width:2.6rem;height:2.6rem;padding:0;border-radius:14px}
.btn-sm.btn-ghost{box-shadow:none}
.speaking{animation:pulse 1s ease-in-out infinite}
.inp{width:100%;padding:.75rem .9rem;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:2.2rem}
.inp:focus{outline:none;border-color:var(--cobalt)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .65rem;border-radius:999px;font-size:.78rem;font-weight:500;background:var(--card2);border:1.5px solid var(--line);color:var(--ink2);line-height:1.6}
.chip-cobalt{background:var(--cobalt-soft);border-color:transparent;color:var(--cobalt)}
.dark .chip-cobalt{color:#c9d0ff}
.chip-mint{background:var(--mint-soft);border-color:transparent;color:var(--mint-ink)}
.chip-rose{background:var(--rose-soft);border-color:transparent;color:var(--rose-ink)}
.chip-amber{background:var(--amber-soft);border-color:transparent;color:#8a4b00}
.dark .chip-amber{color:#ffd9a0}
.chip-mark{background:var(--mark);border-color:transparent;color:var(--mark-ink)}
button.chip{cursor:pointer} button.chip:hover{border-color:var(--cobalt)}
.mark{background-image:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .1em;border-radius:3px;color:inherit}
.dark .mark{background-image:linear-gradient(var(--mark),var(--mark));color:var(--mark-ink);padding:0 .22em;border-radius:6px}
.mark-draw{background-repeat:no-repeat;background-size:0 100%;animation:draw .9s .35s ease-out forwards}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--cobalt);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.mint>i{background:var(--mint)} .bar.mark>i{background:var(--mark)} .bar.rose>i{background:var(--rose)}
.bar.mark{background-image:none;padding:0;color:inherit}
.opt{display:flex;align-items:flex-start;gap:.7rem;width:100%;text-align:left;padding:.85rem 1rem;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;transition:border-color .15s,background .15s,transform .1s;font-size:.95rem}
.opt:hover{border-color:var(--cobalt)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt[disabled]{cursor:default}
.opt .k{flex:none;width:1.6rem;height:1.6rem;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted)}
.wchip{display:inline-block;padding:.25rem .6rem;margin:.18rem;border-radius:10px;border:2px solid var(--line);font-weight:500;font-size:1.08rem;background:var(--card);cursor:pointer;transition:background .2s,border-color .2s}
.wchip.ok{background:var(--mint-soft);border-color:var(--mint)}
.wchip.close{background:var(--amber-soft);border-color:var(--amber)}
.wchip.miss{background:var(--rose-soft);border-color:var(--rose)}
.wchip.pend{opacity:.55}
.wchip.pick{border-color:var(--cobalt);background:var(--cobalt-soft)}
.bub{max-width:88%;padding:.7rem .95rem;border-radius:18px;border:1.5px solid var(--line);background:var(--card)}
.bub.me{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--edge);border-bottom-right-radius:6px;margin-left:auto}
.bub.npc{border-bottom-left-radius:6px}
.fb{margin-left:auto;max-width:92%;padding:.7rem .9rem;border-radius:14px;background:var(--card2);border:1.5px dashed var(--line);font-size:.88rem}
.navi{display:flex;align-items:center;gap:.75rem;padding:.55rem .75rem;border-radius:14px;font-weight:400;color:var(--ink2);cursor:pointer;border:2px solid transparent;background:none;width:100%;text-align:left}
.navi:hover{background:var(--card2)}
.navi.active{background:var(--card);border-color:var(--edge);box-shadow:3px 3px 0 var(--edge);color:var(--ink);font-weight:500}
.dark .navi.active{border-color:var(--line);box-shadow:3px 3px 0 #000}
.navi .ic{width:2rem;height:2rem;border-radius:10px;display:grid;place-items:center;background:var(--card2);font-size:1.05rem}
.navi.active .ic{background:var(--mark)}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:.15rem;background:var(--card);border-top:2px solid var(--edge);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom));z-index:40;overflow-x:auto}
.dark .bnav{border-top-color:var(--line)}
.bn{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:.3rem .2rem;border-radius:12px;font-size:.66rem;font-weight:400;color:var(--muted);background:none;border:0;cursor:pointer}
.bn .e{font-size:1.15rem;line-height:1.2}
.bn.active{color:var(--mark-ink);background:var(--mark);font-weight:500}
.kw{border:0;border-bottom:2px dotted var(--cobalt);background:var(--cobalt-soft);border-radius:4px;padding:0 .15em;cursor:pointer;font:inherit;color:inherit}
.blur-text{filter:blur(7px);user-select:none;cursor:pointer}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--cobalt);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.tile{width:5rem;height:5rem;border-radius:22px;display:grid;place-items:center;font-size:2.6rem;background:var(--mark);border:2px solid var(--edge)}
.dark .tile{border-color:#000}
.rec{background:var(--rose)!important;color:#fff!important;animation:pulse 1s ease-in-out infinite}
#toasts{position:fixed;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:70}
@media(min-width:1024px){#toasts{bottom:24px}}
.toast{padding:.55rem .9rem;border-radius:14px;border:2px solid var(--edge);background:var(--card);box-shadow:3px 3px 0 var(--edge);font-weight:500;font-size:.88rem;animation:toast-in .25s ease,toast-out .3s ease 2.6s forwards}
.toast.xp{background:var(--mark);color:var(--mark-ink)}
.toast.badge,.toast.level{background:var(--cobalt);color:var(--cobalt-ink)}
.modal-bg{position:fixed;inset:0;background:rgba(8,12,30,.55);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal-bg{align-items:center;padding:1rem}}
.modal-card{background:var(--card);border:2px solid var(--edge);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:1.4rem}
@media(min-width:640px){.modal-card{border-radius:24px}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:90;pointer-events:none;border-radius:2px;animation:fall 1.8s ease-in forwards}
.vfade{animation:vfade .18s ease-out}
.margin-rule{border-left:0}
@media(min-width:1024px){.margin-rule{border-left:2px solid color-mix(in srgb,var(--rose) 38%,transparent);padding-left:2rem!important}}
.dot{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:500;background:var(--card2);border:2px solid var(--line);color:var(--muted)}
.dot.on{background:var(--mark);border-color:var(--edge);color:var(--mark-ink)}
.dot.today{outline:3px solid var(--cobalt);outline-offset:2px}
.medal{width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--mark);border:2px solid var(--edge)}
.medal.off{background:var(--card2);border-color:var(--line);filter:grayscale(1);opacity:.55}
details>summary{cursor:pointer;list-style:none} details>summary::-webkit-details-marker{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@keyframes draw{to{background-size:100% 100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@keyframes vfade{from{opacity:.4}to{opacity:1}}
@keyframes pop{0%{transform:scale(.96);opacity:.5}100%{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.mark-draw{background-size:100% 100%!important}}
</style>

{id:'t1',d:'tech',l:0,title:"Dark mode and your eyes",text:"Many apps now have a dark mode. It uses black or grey backgrounds instead of white. Some people say it is easier on the eyes at night. It can also save battery on phones with OLED screens. Try both modes and choose the one that feels best for you.",kw:['battery','screen','mode'],q:"Dark mode can save battery on…",o:["phones with OLED screens","every kind of laptop","phones that are switched off"]},
{id:'t2',d:'tech',l:1,title:"The magic of version control",text:"Imagine writing a long essay and accidentally deleting the best paragraph. In software, this rarely becomes a disaster because developers use version control. Every change is saved with a message explaining what happened and who made it, so teams can go back in time whenever something breaks. It also lets many people work on the same project without overwriting each other's work.",kw:['version control','overwriting','disaster'],q:"What lets developers go back in time?",o:["Saved changes in version control","A backup of the whole computer","A message from the manager"]},
{id:'t3',d:'tech',l:3,title:"Technical debt",text:"Technical debt is what happens when a team chooses a quick, imperfect solution to meet a deadline. Like financial debt, it isn't necessarily bad: a small amount can help a start-up move fast. The danger lies in ignoring it. Over time, the ‘interest’ accumulates in the form of fragile code, slower development and frustrated engineers, until even small features take weeks to ship.",kw:['accumulates','fragile','ship'],q:"What does the ‘interest’ in technical debt refer to?",o:["The growing cost of leaving quick fixes unaddressed","The money paid to the bank","The time spent on meetings"]},
{id:'f1',d:'food',l:0,title:"Why salt matters",text:"Salt makes food taste better. A little salt in pasta water gives the pasta more flavour. Chefs taste their food often and add salt slowly. Too much salt is a problem, but too little can make a meal taste flat. Start with a pinch, taste, and then decide.",kw:['pinch','flavour','taste'],q:"What should you do after adding a pinch of salt?",o:["Taste the food","Add more salt at once","Stop cooking"]},
{id:'f2',d:'food',l:2,title:"The Maillard reaction",text:"When you sear a steak, the brown crust is not just for looks. It comes from the Maillard reaction, a chemical process between proteins and sugars that happens at high temperatures. This reaction creates hundreds of new flavour compounds, which is why boiled meat tastes so different from grilled meat. To get a good crust, dry the surface of the meat first, because moisture slows browning.",kw:['sear','crust','moisture'],q:"Why should you dry the meat before searing?",o:["Moisture slows down browning","Dry meat cooks faster inside","It removes the salt"]},
{id:'f3',d:'food',l:3,title:"Umami explained",text:"In 1908, a Japanese chemist identified a fifth basic taste alongside sweet, sour, salty and bitter. He named it umami, meaning ‘pleasant savoury taste’. Found in foods rich in glutamate, such as parmesan, tomatoes, mushrooms and soy sauce, umami gives dishes a satisfying depth. Cooks often combine several umami-rich ingredients, a technique that amplifies the effect far beyond what any single ingredient could achieve.",kw:['amplifies','glutamate','depth'],q:"What does combining umami-rich ingredients do?",o:["It strengthens the overall savoury depth","It makes the dish sweeter","It removes bitterness completely"]},
{id:'v1',d:'travel',l:0,title:"Five phrases that open doors",text:"Before you travel, learn five simple phrases in the local language: hello, please, thank you, sorry, and how much? Local people usually smile when you try. You don't need perfect grammar. Even a small effort can make hotel staff, taxi drivers and shop owners friendlier.",kw:['phrases','effort','local'],q:"Why should you learn simple phrases?",o:["Locals often respond more warmly","You will not need a hotel","You will get free taxis"]},
{id:'v2',d:'travel',l:2,title:"Beating jet lag",text:"Jet lag happens when your body clock no longer matches local time. To reduce it, try shifting your sleep schedule by an hour or two a few days before departure. Once you land, get outside in natural light, because sunlight tells your brain what time it is. Avoid long afternoon naps, which can make it harder to fall asleep at night.",kw:['jet lag','body clock','nap'],q:"What helps reset your body clock after landing?",o:["Natural daylight","A long afternoon nap","Eating a big dinner"]},
{id:'v3',d:'travel',l:3,title:"The problem of overtourism",text:"Overtourism occurs when the number of visitors overwhelms a destination, damaging local life and the environment. Residents in popular cities complain about rising rents and crowded streets, while ancient sites suffer from constant foot traffic. Some authorities now cap daily visitor numbers or charge entry fees, hoping to balance the economic benefits of tourism against the strain it places on communities.",kw:['overwhelms','cap','strain'],q:"Why do some authorities limit visitor numbers?",o:["To reduce pressure on communities and sites","To make tickets more expensive for locals","To stop people from taking photos"]},
{id:'s1',d:'sport',l:0,title:"Layers for the mountains",text:"Mountain weather can change fast. Wear three layers: a warm one close to your body, a middle layer, and a waterproof jacket. If you get hot, take a layer off. If it rains, put your jacket on. Cotton gets cold when it's wet, so choose light, quick-drying clothes.",kw:['layers','waterproof','quick-drying'],q:"Which clothes are best for the mountains?",o:["Light, quick-drying clothes","Heavy cotton clothes","One thick winter coat"]},
{id:'s2',d:'sport',l:2,title:"Why altitude feels hard",text:"At high altitude, the air contains the same percentage of oxygen, but each breath delivers less of it because air pressure is lower. Your body responds by breathing faster and producing more red blood cells, although this adaptation takes days. That's why climbers spend time at intermediate camps before attempting a summit, allowing their bodies to acclimatise gradually.",kw:['altitude','acclimatise','pressure'],q:"Why do climbers use intermediate camps?",o:["To let their bodies adapt gradually","To store extra food","To avoid the sun"]},
{id:'s3',d:'sport',l:3,title:"Leave no trace",text:"The ‘Leave No Trace’ philosophy asks outdoor enthusiasts to minimise their impact on nature. In practice, this means carrying out all rubbish, staying on established trails and observing wildlife from a distance. It may sound simple, yet it requires a mindset shift: the wilderness is not a backdrop for our adventures but a fragile ecosystem that we are temporarily entering.",kw:['wilderness','fragile','ecosystem'],q:"What mindset shift does the text describe?",o:["Seeing nature as a delicate system, not a backdrop","Treating trails as private property","Avoiding all outdoor activity"]},
{id:'c1',d:'cinema',l:0,title:"What does a director do?",text:"A director leads the making of a film. They decide how each scene looks and sounds, and they talk with actors about their characters. On set, everyone listens to the director. But the director also needs a good team: camera operators, sound engineers and editors all help turn an idea into a movie.",kw:['director','scene','editors'],q:"Who talks with actors about their characters?",o:["The director","The sound engineer","The editor"]},
{id:'c2',d:'cinema',l:2,title:"The power of film scores",text:"Imagine a shark scene without its famous two-note music. Film scores guide our emotions, often without us noticing. Fast, rising notes create tension, while soft strings can make a quiet moment feel sad. Composers sometimes give each main character a recurring musical theme, so the audience feels their presence even when they are off-screen.",kw:['score','tension','recurring'],q:"What is a recurring musical theme used for?",o:["To suggest a character's presence","To make the film shorter","To hide mistakes in editing"]},
{id:'c3',d:'cinema',l:3,title:"Show, don't tell",text:"Screenwriters live by the maxim ‘show, don't tell.’ Rather than having a character announce, “I'm furious,” a skilled writer lets us see it: clenched fists, a slammed door, an unfinished sentence. This approach trusts the audience to read between the lines, which makes the experience more immersive and the emotions more convincing than any line of explicit dialogue could.",kw:['maxim','immersive','explicit'],q:"What does ‘show, don't tell’ trust the audience to do?",o:["Understand feelings from actions and details","Read the script before watching","Ignore the dialogue"]}
];

FEED.push(
{id:'x1',d:'fashion',l:0,title:"Three colours that go together",text:"A simple outfit often uses three colours or fewer. Start with a base colour, like black, navy or grey. Add a second colour that you like, and then one small accent, such as a red scarf or yellow shoes. This is an easy rule, and it makes getting dressed faster in the morning.",kw:['colour','accent','outfit'],q:"What is an ‘accent’ colour?",o:["A small touch of a different colour","The main colour of the outfit","A colour you should avoid"]},
{id:'x2',d:'fashion',l:2,title:"How to read a clothing label",text:"Every clothing label contains information that can save your favourite sweater. The fibre content tells you what the item is made of, for example cotton or wool. The care symbols explain how to wash it: a tub with a number shows the maximum water temperature, while a crossed-out triangle means ‘do not bleach’. Following these instructions prevents shrinking and keeps colours bright, so a few seconds of reading can add years to a garment.",kw:['label','shrinking','garment'],q:"What does a crossed-out triangle mean?",o:["Do not bleach","Wash at a high temperature","Dry in the sun"]},
{id:'x3',d:'fashion',l:3,title:"The psychology of what we wear",text:"Researchers use the term ‘enclothed cognition’ to describe how clothing can influence the way we think and behave. In one well-known experiment, participants who wore a white coat described as a doctor's coat paid more attention to detail than those who were told it was a painter's coat. The finding suggests that the symbolic meaning of an item, combined with physically wearing it, can subtly shape performance, which may explain why many people dress deliberately for important occasions.",kw:['cognition','participants','symbolic'],q:"What did the experiment suggest?",o:["The meaning we attach to clothes can affect our performance","White coats always improve exam results","Painters pay less attention to detail"]},
{id:'b1',d:'biz',l:0,title:"Writing a polite email",text:"A good work email is short and clear. Start with a greeting, such as ‘Dear Ms Brown’ or ‘Hi Tom’. In the first sentence, say why you are writing. Then give the main information in two or three lines. Finish with a polite ending, like ‘Best regards’, and your name. Always check the subject line, because people decide quickly whether to open an email.",kw:['greeting','subject line','regards'],q:"What should you say in the first sentence?",o:["Why you are writing","Your whole life story","Nothing, only a greeting"]},
{id:'b2',d:'biz',l:2,title:"Answering a tough interview question",text:"When an interviewer says, ‘Tell me about a time you faced a challenge,’ they are not looking for a perfect story. They want to see how you think. A useful structure is STAR: describe the Situation, explain your Task, outline the Action you took, and finish with the Result. Keep your answer to about two minutes, and use specific numbers where possible, because details make your achievement more credible.",kw:['challenge','outline','credible'],q:"Why should you use specific numbers?",o:["They make your achievement more credible","They make the answer longer","Interviewers dislike words"]},
{id:'b3',d:'biz',l:3,title:"Remote work and trust",text:"The shift to remote work has forced many managers to rethink how they measure performance. Instead of monitoring hours at a desk, effective leaders focus on outcomes, setting clear goals and trusting their teams to decide how to reach them. Studies suggest that this autonomy tends to increase motivation, although it can also blur the boundary between work and private life, leaving employees feeling permanently on call.",kw:['outcomes','autonomy','blur'],q:"What risk of remote work does the text mention?",o:["Work and private life can become hard to separate","Employees stop setting goals","Managers lose all their authority"]}
);

function exerciseBody(it) {
  const bits = [`<p class="muted text-sm mb-2">${esc(it.instr)}</p>`];
  if (it.passage) bits.push(`<div class="card p-4 mb-3" style="background:var(--card2)"><b>${esc(it.title)}</b><p class="mt-1">${esc(it.passage)}</p></div>`);
  if (it.audio) bits.push(`<div class="flex gap-2 mb-3">${sayBtn(it.audio, '🔊 Play sentence', 'btn btn-mark btn-sm')}${sayBtn(it.audio, '🐢 Slowly', 'btn btn-sm', true)}</div>`);
  if (it.text) bits.push(`<h2 class="text-2xl font-bold mb-4" style="line-height:1.35">${fmtBlank(it.text)}</h2>`);
  if (it.type === 'mcq') bits.push(optsHtml(it.opts, PR.picked, PR.revealed, 'pr-pick'));
  else if (it.type === 'type') bits.push(`<div class="flex gap-2"><input id="pr-in" class="inp" placeholder="Type the missing word" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(PR.typed)}" ${PR.revealed ? 'disabled' : ''}>${PR.revealed ? '' : '<button class="btn btn-primary" data-act="pr-type">Check</button>'}</div>`);
  else if (it.type === 'order') {
    const used = PR.ord, bank = it.chips.filter(c => !used.includes(c.id));
    bits.push(`<div class="card p-3 mb-3" style="min-height:3.6rem;border-style:dashed">${used.length ? used.map(id => `<button class="wchip ${PR.revealed ? (PR.res[PR.i] ? 'ok' : 'miss') : 'pick'}" data-act="pr-ord-del" data-id="${id}" ${PR.revealed ? 'disabled' : ''}>${esc(it.chips.find(c => c.id === id).w)}</button>`).join('') : '<span class="muted text-sm">Tap the words below to build the sentence.</span>'}</div>
      <div class="mb-3">${bank.map(c => `<button class="wchip" data-act="pr-ord-add" data-id="${c.id}">${esc(c.w)}</button>`).join('')}</div>
      ${PR.revealed ? '' : `<div class="flex gap-2"><button class="btn btn-ghost btn-sm" data-act="pr-ord-reset">Reset</button><button class="btn btn-primary btn-sm" data-act="pr-ord-check" ${used.length === it.chips.length ? '' : 'disabled'}>Check</button></div>`}`);
  }
  if (PR.revealed) {
    const ok = PR.res[PR.i], last = PR.i >= PR.items.length - 1;
    bits.push(`<div class="mt-4 p-4 rounded-2xl pop" style="background:${ok ? 'var(--mint-soft)' : 'var(--rose-soft)'}"><div class="font-semibold mb-1">${ok ? 'Correct!' : 'Not quite.'}</div>${!ok && it.type === 'type' ? `<div class="text-sm mb-1">Answer: <b>${esc(it.answer)}</b></div>` : ''}${!ok && it.type === 'mcq' ? `<div class="text-sm mb-1">Answer: <b>${esc(it.opts.find(o => o.ok).t)}</b></div>` : ''}<div class="text-sm">${esc(it.explain)}</div></div>
      <div class="mt-4 flex justify-end"><button class="btn btn-primary" data-act="pr-next">${last ? 'Finish' : 'Next'}</button></div>`);
  }
  return bits.join('');
}

function fbHtml(m) {
  const lines = [];

  if (m.polite === true) lines.push('<span class="chip chip-mint">Polite tone</span>'); else if (m.polite === false) lines.push('<span class="chip chip-amber">Try a more polite tone</span>');
  let h = `<div class="flex flex-wrap gap-2 mb-2">${lines.join('')}</div>`;
  if (m.short) h += '<div class="mb-2">Try a full sentence. It sounds more natural.</div>';
  if (m.polite === false) h += '<div class="mb-2 muted">Add “please”, or start with “Could I…?” or “I’d like…”.</div>';
  if (m.issues.length) h += m.issues.map(i => `<div class="mb-1"><b>${esc(i.found)}</b>${i.fix ? ' → <b style="color:var(--mint-ink)">' + esc(i.fix) + '</b>' : ''} <span class="muted">${esc(i.msg)}</span></div>`).join('');
  else if (m.ok) h += '<div class="mb-1">No grammar slips spotted.</div>';
  h += `<div class="mt-2 pt-2" style="border-top:1.5px dashed var(--line)"><span class="muted">Natural option:</span> “${esc(m.model)}” ${sayBtn(m.model, '🔊', 'btn btn-sm btn-ghost')}</div>`;

};
Object.assign(ACT, ACT2);
function updateWCount() { const t = $('#wtext'), c = $('#wcount'); if (t && c) { const n = (t.value.match(/[A-Za-z']+/g) || []).length; c.textContent = n + ' word' + (n === 1 ? '' : 's'); } }

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACT[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); if (f.dataset.form === 'lookup') doLookup($('#vq').value); });
document.addEventListener('input', e => { if (e.target.id === 'wtext') updateWCount(); });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.target.id === 'rp-in' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ACT['rp-send'](); return; }
  if (e.target.id === 'pr-in' && e.key === 'Enter') { e.preventDefault(); ACT['pr-type'](); return; }
  if (e.key === 'Escape' && $('#modal').innerHTML) { $('#modal').innerHTML = ''; return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (route === 'vocab' && ui.vtab === 'review' && ui.rv && ui.rv.i < ui.rv.queue.length) {
    if (e.key === ' ' && !ui.rv.flip) { e.preventDefault(); ACT['review-flip'](); }
    else if (ui.rv.flip && '1234'.includes(e.key)) ACT.rate({ dataset:{ r:String(+e.key - 1) } });
  }
});

/* ---------- init ---------- */
function init() {
  loadState();
  document.documentElement.classList.toggle('dark', (S.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark');
  if (TTS.ok) { TTS.load(); try { speechSynthesis.onvoiceschanged = () => TTS.load(); } catch (e) {} }
  if (!S.onboarded) { renderOnboarding(); return; }
  shell(); go('home'); checkBadges(); if (!S.tour) setTimeout(() => openTour(0), 600);
  setupInstallBits();
}
window.addEventListener('beforeunload', () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} });
init();
</script>
